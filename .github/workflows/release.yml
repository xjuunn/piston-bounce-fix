# Publish a GitHub release automatically when a tag is pushed.
#
# Tag with the version you want to ship, for example:
#   git tag 1.0.0 && git push origin 1.0.0
#
# The tag name becomes the mod version, so the jar is built and named after it.

name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -Pversion="${GITHUB_REF_NAME#v}"
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/libs/*.jar